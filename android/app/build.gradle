plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.resumebot'
    compileSdk 37
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.example.resumebot"
        // 26 (Android 8.0) 起可用 NotificationChannel 与前台服务标准 API；
        // 目标机为 Android 16，这里抬高下限以去掉全部低版本分支。
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "2.0-poll"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
